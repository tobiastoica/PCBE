version: '3.8'

networks:
  fleet-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:

services:
  # -------------------------------------------------------------
  # 1. Authoritative Datastore: PostgreSQL 16 (SSoT)
  # -------------------------------------------------------------
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: unless-stopped
    networks:
      - fleet-net
    environment:
      POSTGRES_DB: fleet_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fleet_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 2. In-Memory Geospatial Datastore: Redis 7
  # -------------------------------------------------------------
  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    networks:
      - fleet-net
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 3. Message Broker: Apache Kafka (KRaft mode)
  # -------------------------------------------------------------
  kafka-broker:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-broker
    restart: unless-stopped
    networks:
      - fleet-net
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-broker:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-broker:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L622nShTWWkrFuMmBNBur'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # -------------------------------------------------------------
  # 4. Central Management Server (Java 21, Spring Boot 3.3)
  # -------------------------------------------------------------
  central-server:
    build:
      context: ./central-server
      dockerfile: Dockerfile
    container_name: central-server
    restart: unless-stopped
    networks:
      - fleet-net
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/fleet_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      SPRING_DATA_REDIS_HOST: redis-cache
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-broker:29092
      FLEET_SECURITY_API_KEY: fleet-secret-key-2026
      JWT_SECRET: c2VjdXJlX2ZsZWV0X21hbmFnZW1lbnRfc2VjcmV0X2tleV8yMDI2X2Z1bGxfbGVuZ3RoXzUxMmJpdA==
      DOCKER_HOST_URI: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      kafka-broker:
        condition: service_started

  # -------------------------------------------------------------
  # 5. Admin & User Web UI (React + Vite + Leaflet)
  # -------------------------------------------------------------
  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
    container_name: admin-frontend
    restart: unless-stopped
    networks:
      - fleet-net
    ports:
      - "3010:80"
    environment:
      VITE_API_BASE_URL: http://localhost:8081
    depends_on:
      - central-server
