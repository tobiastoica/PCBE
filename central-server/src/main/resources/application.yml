server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: central-management-server

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fleet_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: central-server-fleet-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

fleet:
  security:
    api-key: ${FLEET_SECURITY_API_KEY:fleet-secret-key-2026}
    jwt-secret: ${JWT_SECRET:c2VjdXJlX2ZsZWV0X21hbmFnZW1lbnRfc2VjcmV0X2tleV8yMDI2X2Z1bGxfbGVuZ3RoXzUxMmJpdA==}
    jwt-expiration-ms: 86400000 # 24 hours
  docker:
    host: ${DOCKER_HOST_URI:unix:///var/run/docker.sock}
    station-image: ${STATION_DOCKER_IMAGE:charging-station-service:latest}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
