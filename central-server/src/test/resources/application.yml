server:
  port: 8081

spring:
  application:
    name: central-management-server-test

  datasource:
    url: jdbc:h2:mem:fleet_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    consumer:
      auto-offset-reset: earliest

fleet:
  security:
    api-key: test-api-key-2026
    jwt-secret: c2VjdXJlX2ZsZWV0X21hbmFnZW1lbnRfc2VjcmV0X2tleV8yMDI2X2Z1bGxfbGVuZ3RoXzUxMmJpdA==
    jwt-expiration-ms: 3600000
  docker:
    host: unix:///var/run/docker.sock
    station-image: charging-station-service:latest
